name: Android release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true

      - name: Validate tag and version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(sed -n "s/^version: \([^+]*\).*/\1/p" flutter_app/pubspec.yaml)"
          test "$tag_version" = "$app_version" || {
            echo "Tag $tag_version does not match pubspec version $app_version"
            exit 1
          }

      - name: Restore release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > flutter_app/android/jcg-release.jks
          cat > flutter_app/android/key.properties <<EOF
          storeFile=jcg-release.jks
          keyAlias=$ANDROID_KEY_ALIAS
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Run Flutter tests
        working-directory: flutter_app
        run: flutter test --no-pub

      - name: Build universal APK
        working-directory: flutter_app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FASTAPI_BASE_URL: ${{ secrets.FASTAPI_BASE_URL }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          test -n "$FASTAPI_BASE_URL"
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=FASTAPI_BASE_URL="$FASTAPI_BASE_URL" \
            --dart-define=APP_ENV=production

      - name: Build ABI APKs
        working-directory: flutter_app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FASTAPI_BASE_URL: ${{ secrets.FASTAPI_BASE_URL }}
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=FASTAPI_BASE_URL="$FASTAPI_BASE_URL" \
            --dart-define=APP_ENV=production

      - name: Create checksums
        working-directory: flutter_app/build/app/outputs/flutter-apk
        run: sha256sum app-release.apk app-arm64-v8a-release.apk app-armeabi-v7a-release.apk app-x86_64-release.apk > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: flutter_app/build/app/outputs/flutter-apk
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app-release.apk \
            app-arm64-v8a-release.apk \
            app-armeabi-v7a-release.apk \
            app-x86_64-release.apk \
            SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "JCG Fitness ${GITHUB_REF_NAME#v}" \
            --generate-notes
