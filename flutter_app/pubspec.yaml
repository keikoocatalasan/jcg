name: jcg_fitness
description: JCG Fitness - Budget-aware nutrition tracking
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Supabase
  supabase_flutter: ^2.0.0

  # SQLite
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1

  # State management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Routing
  go_router: ^13.0.0

  # HTTP & connectivity
  http: ^1.1.2
  http_parser: ^4.0.0
  connectivity_plus: ^6.0.0

  # Utilities
  uuid: ^4.2.1
  intl: ^0.19.0
  collection: ^1.18.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.1

  # UI
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  fl_chart: ^0.66.0

  # Camera / image (AI scanner)
  camera: ^0.10.5
  image_picker: ^1.0.7
  image: ^4.9.2
  tflite_flutter: ^0.12.1

  # Secure storage for tokens
  flutter_secure_storage: ^9.0.0

  # Native Google Sign-In
  google_sign_in: ^6.2.1

  # Permissions (camera, notifications)
  permission_handler: ^11.3.1

  # Background sync (Doze-safe)
  workmanager: ^0.9.0

  # Device info for capability checks
  device_info_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.7
  mockito: ^5.4.4
  sqflite_common_ffi: ^2.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/dishes/
    - assets/icons/
    - assets/models/
